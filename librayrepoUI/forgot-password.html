<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — IGDTUW Question Papers Archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">

  <header class="login-topbar">
    <div class="igdtuw-badge">
      <div class="badge-emblem">
        <img src="assets/igdtuw-logo.png" alt="IGDTUW Logo" />
      </div>
      <div class="badge-text">
        <span class="univ-name">IGDTUW</span>
        <span class="univ-sub">Indira Gandhi Delhi Technical University for Women</span>
      </div>
    </div>
    <div style="margin-left:auto;">
      <a href="login.html" style="color:rgba(255,255,255,0.65);font-size:0.8rem;">&larr; Back to Sign In</a>
    </div>
  </header>

  <main class="login-body">
    <div class="login-container" style="max-width:480px;">

      <div class="login-form-area" style="width:100%;">

        <!-- Step 1: Enter email -->
        <div id="step-email">
          <h2>Forgot Password</h2>
          <p>Enter your registered email to reset your password.</p>

          <form id="forgot-form" novalidate>
            <div class="form-group">
              <label for="reset-email">Institutional Email</label>
              <input
                type="email"
                id="reset-email"
                class="form-control"
                placeholder="your.rollno@igdtuw.ac.in"
                required
              />
            </div>
            <button type="submit" class="btn-login">Send Reset Link</button>
          </form>

          <div style="margin-top:16px;text-align:center;font-size:0.85rem;">
            Remember your password? <a href="login.html" style="color:var(--green-dark);font-weight:600;">Sign In</a>
          </div>
        </div>

        <!-- Step 2: Enter new password (shown after reset link is generated) -->
        <div id="step-reset" style="display:none;">
          <h2>Set New Password</h2>
          <p>Enter your new password below.</p>

          <form id="reset-form" novalidate>
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input
                type="password"
                id="new-password"
                class="form-control"
                placeholder="New password (min 6 characters)"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm Password</label>
              <input
                type="password"
                id="confirm-password"
                class="form-control"
                placeholder="Re-enter new password"
                required
              />
            </div>
            <button type="submit" class="btn-login">Reset Password</button>
          </form>
        </div>

        <!-- Step 3: Success -->
        <div id="step-success" style="display:none;text-align:center;padding:40px 0;">
          <div style="width:48px;height:48px;background:var(--green-light);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;">
            <svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--green-dark);fill:none;stroke-width:2.5;">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <h2>Password Reset</h2>
          <p>Your password has been changed successfully.</p>
          <a href="login.html" class="btn-login" style="display:inline-block;margin-top:16px;text-decoration:none;text-align:center;">Sign In</a>
        </div>

      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
  <script>
    const API_BASE = 'http://localhost:8001/api';
    let resetToken = null;

    // Check if we arrived with a token in URL (e.g. ?token=xxx)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('token')) {
      resetToken = urlParams.get('token');
      document.getElementById('step-email').style.display = 'none';
      document.getElementById('step-reset').style.display = 'block';
    }

    // Step 1: Request reset
    document.getElementById('forgot-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim().toLowerCase();

      if (!email) { showToast('Please enter your email.'); return; }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const resp = await fetch(`${API_BASE}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await resp.json();

        if (data.reset_token) {
          resetToken = data.reset_token;
          document.getElementById('step-email').style.display = 'none';
          document.getElementById('step-reset').style.display = 'block';
          showToast('Reset link generated. Set your new password below.');
        } else {
          showToast(data.message || 'If this email is registered, a reset link has been sent.');
        }
      } catch (err) {
        showToast('Connection error.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });

    // Step 2: Set new password
    document.getElementById('reset-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = document.getElementById('new-password').value.trim();
      const confirm = document.getElementById('confirm-password').value.trim();

      if (pw.length < 6) { showToast('Password must be at least 6 characters.'); return; }
      if (pw !== confirm) { showToast('Passwords do not match.'); return; }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Resetting...';

      try {
        const resp = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, new_password: pw }),
        });

        if (!resp.ok) {
          const err = await resp.json();
          showToast(err.detail || 'Reset failed.');
          return;
        }

        document.getElementById('step-reset').style.display = 'none';
        document.getElementById('step-success').style.display = 'block';
      } catch (err) {
        showToast('Connection error.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
